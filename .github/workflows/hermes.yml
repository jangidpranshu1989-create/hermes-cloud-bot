name: 24-7 Hermes Telegram Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hermes Agent
        run: |
          pip install hermes-agent

      - name: Configure and Launch Verified Nvidia Bot
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_USER_ID }}
        run: |
          mkdir -p ~/.hermes
          
          # Environment key binding
          echo "NVIDIA_API_KEY=$NVIDIA_API_KEY" > ~/.hermes/.env
          
          # Direct layout configurations
          cat << EOC > ~/.hermes/config.yaml
          provider: nvidia
          model:
            default: "minimaxai/minimax-m2.7"
            provider: "nvidia"
            base_url: "https://nvidia.com"
          messaging:
            gateway: telegram
          telegram:
            token: "$TELEGRAM_BOT_TOKEN"
            allowed_users: ["$TELEGRAM_ALLOWED_USERS"]
          EOC
          
          echo "Launching Cloud Server Engine with serve mode..."
          # Fix: Using 'serve' command with gateway parameter to prevent crash
          hermes serve
