name: 24-7 Hermes Telegram Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hermes Agent
        run: |
          pip install hermes-agent

      - name: Configure Nvidia Provider and Launch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_USER_ID }}
        run: |
          mkdir -p ~/.hermes
          
          # Exact config building based on your local audit
          cat << EOC > ~/.hermes/config.yaml
          provider: nvidia
          model:
            default: "minimaxai/minimax-m2.7"
            provider: "nvidia"
            base_url: "https://integrate.api.nvidia.com/v1"
          messaging:
            gateway: telegram
          telegram:
            token: "$TELEGRAM_BOT_TOKEN"
            allowed_users: ["$TELEGRAM_ALLOWED_USERS"]
          EOC
          
          echo "Starting Cloud Bot with Local Verified Config..."
          hermes gateway run telegram
