name: 24-7 Hermes Telegram Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hermes Agent
        run: |
          pip install hermes-agent

      - name: Run Hermes Telegram Gateway
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_USER_ID }}
        run: |
          export HERMES_COV_TOKEN=$GITHUB_TOKEN
          echo "Starting Hermes Telegram Bot with Safe Security..."
          
          # Allowed users setting configure kar rahe hain
          mkdir -p ~/.hermes
          echo "telegram:" > ~/.hermes/config.yaml
          echo "  allowed_users: [\"$TELEGRAM_ALLOWED_USERS\"]" >> ~/.hermes/config.yaml
          
          # Launch Telegram Bot
          hermes gateway --provider copilot --gateway telegram --token $TELEGRAM_BOT_TOKEN &
          
          echo "Hermes Cloud Agent is now listening!"
          sleep 21000
