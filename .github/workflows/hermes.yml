name: 24-7 Hermes WhatsApp Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hermes Agent
        run: |
          pip install hermes-agent

      - name: Auto-Configure and Launch WhatsApp
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          export HERMES_COV_TOKEN=$GITHUB_TOKEN
          
          # Pehle se hi setup configurations inject kar rahe hain taaki interactive prompt na ruke
          mkdir -p ~/.hermes
          echo "gateway: whatsapp" > ~/.hermes/config.yaml
          echo "whatsapp_mode: self" >> ~/.hermes/config.yaml
          
          # Force start the gateway to print QR Code directly into the active terminal logs
          hermes gateway --provider copilot --gateway whatsapp
