name: 24-7 Hermes Telegram Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hermes Agent
        run: |
          pip install hermes-agent

      - name: Run Hermes Telegram Gateway
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          export HERMES_COV_TOKEN=$GITHUB_TOKEN
          echo "Starting Hermes Telegram Bot..."
          
          # Telegram gateway ko launch karenge aur background loop me dalenge
          hermes gateway --provider copilot --gateway telegram --token $TELEGRAM_BOT_TOKEN &
          
          # Keep-alive loop taaki cloud server 24/7 chalta rahe
          sleep 21000
