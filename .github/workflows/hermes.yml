name: 24-7 Hermes Copilot Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hermes Agent
        run: |
          pip install hermes-agent

      - name: Run Hermes WhatsApp Gateway
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          export HERMES_COV_TOKEN=$GITHUB_TOKEN
          # WhatsApp mode start
          hermes gateway --provider copilot --gateway whatsapp
